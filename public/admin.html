<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Hotspot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500;1,700&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Pink and white, with champagne gold hairlines */
            --white: #ffffff;
            --ivory: #fffafb;
            --blush: #fde8ee;
            --blush-deep: #f7c7d5;
            --pink: #e5487f;
            --pink-mid: #ee6c9a;
            --pink-btn: #c8336c;
            --pink-dark: #a02456;
            --rose-deep: #d63f78;
            --gold: #c8a45c;
            --gold-soft: #f6e8c4;
            --ink: #2a1a21;
            --text: #4a3640;
            --wine: #8a1c3d;
            --green: #3f7a5a;

            --font-display: 'Bodoni Moda', 'Didot', 'Bodoni MT', Georgia, serif;
            --font-script: 'Pinyon Script', 'Segoe Script', cursive;
            --font-body: 'Jost', 'Segoe UI', Tahoma, Verdana, sans-serif;

            /* Fanned feather wings, mirrored around the centre */
            --wings: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 140'><g fill='white'><ellipse cx='-110' rx='110' ry='11' transform='translate(290 110) rotate(5)'/><ellipse cx='-100' rx='100' ry='11' transform='translate(290 110) rotate(17)'/><ellipse cx='-88' rx='88' ry='10' transform='translate(290 110) rotate(29)'/><ellipse cx='-72' rx='72' ry='10' transform='translate(290 110) rotate(41)'/><ellipse cx='-56' rx='56' ry='9' transform='translate(290 110) rotate(53)'/><ellipse cx='110' rx='110' ry='11' transform='translate(310 110) rotate(-5)'/><ellipse cx='100' rx='100' ry='11' transform='translate(310 110) rotate(-17)'/><ellipse cx='88' rx='88' ry='10' transform='translate(310 110) rotate(-29)'/><ellipse cx='72' rx='72' ry='10' transform='translate(310 110) rotate(-41)'/><ellipse cx='56' rx='56' ry='9' transform='translate(310 110) rotate(-53)'/></g></svg>");

            /* Faint lace motif */
            --lace: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23e5487f' stroke-opacity='0.12' stroke-width='1'><path d='M32 6 L58 32 L32 58 L6 32 Z'/><path d='M32 16 L48 32 L32 48 L16 32 Z'/><circle cx='32' cy='32' r='4'/><circle cx='0' cy='0' r='7'/><circle cx='64' cy='0' r='7'/><circle cx='0' cy='64' r='7'/><circle cx='64' cy='64' r='7'/></g></svg>");
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            color: var(--text);
            background:
                var(--lace),
                radial-gradient(ellipse at 10% 0%, rgba(255, 255, 255, 0.9) 0%, transparent 50%),
                linear-gradient(180deg, #fff3f6 0%, #fbd3e0 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }

        :focus-visible {
            outline: 3px solid var(--pink-dark);
            outline-offset: 3px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(42, 26, 33, 0.72);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            position: relative;
            background: var(--white);
            color: var(--text);
            padding: 46px 38px 38px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--gold);
            box-shadow:
                inset 0 0 0 6px var(--white),
                inset 0 0 0 7px var(--gold),
                0 24px 50px rgba(42, 26, 33, 0.45);
        }

        /* Wings spread above the login box */
        .login-box::before {
            content: '';
            position: absolute;
            left: 50%;
            top: -66px;
            width: 380px;
            max-width: 110%;
            height: 88px;
            transform: translateX(-50%);
            background: var(--wings) center bottom / contain no-repeat;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.25));
            pointer-events: none;
        }

        /* Scalloped lace edge */
        .login-box::after {
            content: '';
            position: absolute;
            left: -1px;
            right: -1px;
            bottom: -11px;
            height: 10px;
            background: radial-gradient(circle at 10px 0, var(--pink) 0 9px, transparent 9.5px) 0 0 / 20px 10px repeat-x;
        }

        .login-box h2 {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 700;
            font-size: 32px;
            color: var(--ink);
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--gold);
        }

        .login-box input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 16px;
            background: var(--ivory);
            color: var(--ink);
            border: 1px solid var(--blush-deep);
            border-radius: 0;
            font-family: var(--font-body);
            font-size: 15px;
        }

        .login-box input::placeholder {
            color: #8d7a83;
        }

        .login-box input:focus {
            outline: none;
            border-color: var(--pink);
            box-shadow: 0 0 0 3px rgba(229, 72, 127, 0.18);
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: var(--pink-btn);
            color: #fff;
            border: 1px solid var(--gold);
            border-radius: 0;
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .login-box button:hover {
            background: var(--pink-dark);
        }

        .login-box .message {
            margin: 14px 0 0;
            text-align: left;
        }

        /* Admin Dashboard */
        .dashboard {
            display: none;
        }

        .header {
            position: relative;
            background: linear-gradient(180deg, var(--pink-mid) 0%, var(--rose-deep) 100%);
            color: #fff;
            padding: 24px 32px;
            margin-top: 14px;
            margin-bottom: 46px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            border: 1px solid var(--gold);
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 14px 30px rgba(160, 36, 86, 0.3);
        }

        /* Wings fanned out behind the title bar */
        .header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--wings) center bottom / auto 130% no-repeat;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Scalloped lace edge under the header */
        .header::after {
            content: '';
            position: absolute;
            left: -1px;
            right: -1px;
            bottom: -13px;
            height: 10px;
            background: radial-gradient(circle at 10px 0, var(--rose-deep) 0 9px, transparent 9.5px) 0 0 / 20px 10px repeat-x;
        }

        .header > * {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 700;
            color: #fff;
            font-size: 32px;
            line-height: 1.15;
            text-shadow: 0 2px 6px rgba(120, 20, 60, 0.35);
        }

        .header .admin-info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: var(--font-script);
            font-size: 28px;
            color: #fff6dd;
            text-shadow: 0 2px 6px rgba(120, 20, 60, 0.35);
        }

        .logout-btn {
            padding: 9px 22px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid #fff;
            border-radius: 0;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: none;
            transition: background 0.15s, color 0.15s;
        }

        .logout-btn:hover {
            background: #fff;
            color: var(--pink-dark);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 22px;
            margin-bottom: 34px;
        }

        .stat-card {
            background: var(--white);
            padding: 26px 26px 24px;
            border: 1px solid var(--gold);
            border-top: 4px solid var(--pink);
            box-shadow:
                inset 0 0 0 4px var(--white),
                inset 0 0 0 5px var(--blush-deep),
                0 10px 22px rgba(160, 36, 86, 0.18);
            text-align: center;
        }

        .stat-card h3 {
            font-family: var(--font-script);
            font-weight: 400;
            font-size: 28px;
            color: var(--pink-dark);
            margin-bottom: 2px;
        }

        .stat-card .number {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 52px;
            line-height: 1.1;
            color: var(--ink);
        }

        .users-section {
            background: var(--white);
            padding: 36px 36px 32px;
            border: 1px solid var(--gold);
            box-shadow:
                inset 0 0 0 6px var(--white),
                inset 0 0 0 7px var(--gold),
                0 20px 40px rgba(160, 36, 86, 0.22);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--gold);
        }

        .section-header h2 {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 700;
            color: var(--ink);
            font-size: 28px;
        }

        .refresh-btn {
            padding: 10px 22px;
            background: var(--pink-btn);
            color: #fff;
            border: 1px solid var(--gold);
            border-radius: 0;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            transition: background 0.15s;
        }

        .refresh-btn:hover {
            background: var(--pink-dark);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 15px;
            text-align: left;
            border-bottom: 1px solid var(--blush);
        }

        th {
            background: var(--blush);
            color: var(--ink);
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 700;
            font-size: 16px;
            border-bottom: 2px solid var(--pink-mid);
            white-space: nowrap;
        }

        td {
            color: var(--text);
            font-size: 14px;
        }

        tbody tr:hover {
            background: rgba(253, 232, 238, 0.6);
        }

        .status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid currentColor;
        }

        .status.pending {
            background: var(--gold-soft);
            color: #6b5210;
        }

        .status.approved {
            background: #d6eadd;
            color: #21533a;
        }

        .status.rejected {
            background: #f6cbd6;
            color: var(--wine);
        }

        .traffic-info {
            font-size: 12px;
            color: var(--text);
            line-height: 1.6;
        }

        .traffic-info span {
            font-weight: 600;
            color: var(--ink);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 7px 14px;
            border: 1px solid var(--gold);
            border-radius: 0;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
            transition: transform 0.15s, filter 0.15s;
            white-space: nowrap;
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .approve-btn {
            background: var(--green);
        }

        .reject-btn {
            background: var(--wine);
        }

        .delete-btn {
            background: var(--ink);
        }

        .action-btn:disabled {
            background: #f1e6ea;
            color: #a8969d;
            border-color: #e3d3d9;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 14px 16px;
            border-radius: 0;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            border: 1px solid;
            border-left-width: 5px;
        }

        .message.success {
            background: #e3f1e8;
            color: #21533a;
            border-color: var(--green);
        }

        .message.error {
            background: #fbdce5;
            color: var(--wine);
            border-color: var(--wine);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--pink-dark);
            font-family: var(--font-script);
            font-size: 28px;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 26px;
            height: 26px;
            border: 3px solid var(--pink);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 12px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--pink-dark);
            font-family: var(--font-script);
            font-size: 28px;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 14px;
            color: var(--pink-mid);
            opacity: 0.8;
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .header { padding: 20px; margin-bottom: 40px; }
            .header h1 { font-size: 24px; }
            .header::before { background-size: auto 100%; opacity: 0.3; }
            .users-section { padding: 22px 18px; }
            .login-box::before { width: 300px; top: -52px; height: 70px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading::after { animation: none; }
            .action-btn, .refresh-btn, .logout-btn, .login-box button { transition: none; }
        }
    </style>
</head>
<body>
    <!-- Login Modal -->
    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <h2>🔐 Admin Login</h2>
            <form id="loginForm">
                <input type="password" id="adminPassword" placeholder="Masukkan password admin" required>
                <button type="submit">Login</button>
            </form>
            <div class="message" id="loginMessage"></div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="container dashboard" id="dashboard">
        <div class="header">
            <h1>📊 Admin Panel - Hotspot</h1>
            <div class="admin-info">
                <span id="adminName">Admin</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <div class="number" id="pendingUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Approved</h3>
                <div class="number" id="approvedUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Rejected</h3>
                <div class="number" id="rejectedUsers">0</div>
            </div>
        </div>

        <div class="users-section">
            <div class="section-header">
                <h2>Daftar User</h2>
                <button class="refresh-btn" onclick="loadUsers()">🔄 Refresh</button>
            </div>

            <div class="message" id="message"></div>

            <div class="table-container">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>Username</th>
                            <th>Status</th>
                            <th>Tanggal</th>
                            <th>Penggunaan Traffic</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <p>Belum ada user terdaftar</p>
            </div>

            <div class="loading" id="loading" style="display: none;">
                Memuat data...
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi Alamat Backend
        const BACKEND_URL = window.location.origin.includes('vercel.app') 
            ? window.location.origin 
            : 'https://nama-proyek-kamu.vercel.app';

        let isAdminLoggedIn = false;
        let adminName = 'Admin';

        // Format Byte ke KB, MB, atau GB
        function formatBytes(bytes) {
            if (!bytes || bytes == 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Check if already logged in
        if (localStorage.getItem('adminLoggedIn') === 'true') {
            isAdminLoggedIn = true;
            adminName = localStorage.getItem('adminName') || 'Admin';
            showDashboard();
        }

        // Login form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;

            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success) {
                    isAdminLoggedIn = true;
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminName', adminName);
                    showDashboard();
                } else {
                    showLoginMessage(data.message, 'error');
                }
            } catch (error) {
                showLoginMessage('Terjadi kesalahan. Silakan coba lagi.', 'error');
            }
        });

        function showLoginMessage(text, type) {
            const message = document.getElementById('loginMessage');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';

            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }

        function showDashboard() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('adminName').textContent = adminName;
            loadUsers();
        }

        function logout() {
            isAdminLoggedIn = false;
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminName');
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        async function loadUsers() {
            const loading = document.getElementById('loading');
            const tableBody = document.getElementById('usersTableBody');
            const emptyState = document.getElementById('emptyState');

            loading.style.display = 'block';
            tableBody.innerHTML = '';
            emptyState.style.display = 'none';

            try {
                const response = await fetch(`${BACKEND_URL}/api/users`);
                const data = await response.json();

                if (data.success) {
                    const users = data.users;
                    
                    // Update stats
                    document.getElementById('totalUsers').textContent = users.length;
                    document.getElementById('pendingUsers').textContent = users.filter(u => u.status === 'pending').length;
                    document.getElementById('approvedUsers').textContent = users.filter(u => u.status === 'approved').length;
                    document.getElementById('rejectedUsers').textContent = users.filter(u => u.status === 'rejected').length;

                    if (users.length === 0) {
                        emptyState.style.display = 'block';
                    } else {
                        users.forEach(user => {
                            const bytesIn = formatBytes(user.bytesIn || 0);
                            const bytesOut = formatBytes(user.bytesOut || 0);
                            const uptime = user.uptime || 'Off';

                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${user.name}</td>
                                <td>${user.email}</td>
                                <td>${user.username}</td>
                                <td><span class="status ${user.status}">${user.status}</span></td>
                                <td>${new Date(user.timestamp).toLocaleDateString('id-ID')}</td>
                                <td>
                                    <div class="traffic-info">
                                        ⏱️ Uptime: <span>${uptime}</span><br>
                                        ⬇️ Download: <span>${bytesOut}</span> | ⬆️ Upload: <span>${bytesIn}</span>
                                    </div>
                                </td>
                                <td>
                                    <div class="actions">
                                        <button class="action-btn approve-btn" 
                                            onclick="approveUser('${user.username}')" 
                                            ${user.status !== 'pending' ? 'disabled' : ''}>
                                            ✓ Approve
                                        </button>
                                        <button class="action-btn reject-btn" 
                                            onclick="rejectUser('${user.username}')"
                                            ${user.status !== 'pending' ? 'disabled' : ''}>
                                            ✗ Reject
                                        </button>
                                        <button class="action-btn delete-btn" 
                                            onclick="deleteUser('${user.username}')">
                                            🗑 Delete
                                        </button>
                                    </div>
                                </td>
                            `;
                            tableBody.appendChild(row);
                        });
                    }
                }
            } catch (error) {
                showMessage('Gagal memuat data user', 'error');
            } finally {
                loading.style.display = 'none';
            }
        }

        async function approveUser(username) {
            if (!confirm(`Approve user ${username}?`)) return;

            try {
                const response = await fetch(`${BACKEND_URL}/api/approve`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, adminName })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`User ${username} berhasil diapprove`, 'success');
                    loadUsers();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Gagal approve user', 'error');
            }
        }

        async function rejectUser(username) {
            if (!confirm(`Reject user ${username}?`)) return;

            try {
                const response = await fetch(`${BACKEND_URL}/api/reject`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, adminName })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`User ${username} berhasil direject`, 'success');
                    loadUsers();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Gagal reject user', 'error');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Hapus user ${username}?`)) return;

            try {
                const response = await fetch(`${BACKEND_URL}/api/users/${username}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`User ${username} berhasil dihapus`, 'success');
                    loadUsers();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Gagal menghapus user', 'error');
            }
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';

            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }

        // Auto refresh every 30 seconds
        setInterval(() => {
            if (isAdminLoggedIn) {
                loadUsers();
            }
        }, 30000);
    </script>
</body>
</html>
